name: TROLL V28 Reward Ledger CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reward-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm V19 review target unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Syntax
        run: node --check v28/ledger/reward-ledger.mjs
      - name: Reward ledger tests
        run: node v28/test/reward-ledger.test.mjs
      - name: Confirm no valuation or transaction surface
        run: |
          test ! -d v28/contracts
          ! grep -R "eth_sendTransaction\|eth_sendRawTransaction\|eth_requestAccounts" v28/ledger
          echo "PASS — V28 accounting/read layer"
