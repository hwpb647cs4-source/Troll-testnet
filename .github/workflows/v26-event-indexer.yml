name: TROLL V26 Event Indexer CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v26/package.json
      - name: Confirm V19 review target unchanged
        working-directory: .
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Install pinned indexer dependency
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check indexer/indexer.mjs
          node --check indexer/run-indexer.mjs
      - name: Deterministic event reducer test
        run: npm test
      - name: Confirm read-only
        run: |
          ! grep -R "eth_sendTransaction\|eth_sendRawTransaction\|eth_requestAccounts\|DEPLOYER_PRIVATE_KEY" indexer
          echo "PASS — V26 read-only indexer"
