name: TROLL V32 Release Control CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Release gate tests
        run: node v32/test/release-control.test.mjs
      - name: Enforce current no-broadcast state
        run: |
          node -e 'const m=require("./v32/release-manifest.json"); if(m.release_mode!=="NO_MAINNET_BROADCAST") process.exit(1); console.log("PASS no-broadcast")'
          test ! -d v32/contracts
