name: TROLL V16 Production Rehearsal CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v16/package.json
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Validate blocked production template
        run: npm run validate:config
      - name: Compile exact V15 source through V16 rehearsal config
        run: npm run compile
      - name: Confirm no production broadcast credentials exist in CI
        run: |
          test -z "$DEPLOYER_PRIVATE_KEY"
          test -z "$RH_RPC_URL"
          echo "PASS — CI has no production signer/RPC secrets"
