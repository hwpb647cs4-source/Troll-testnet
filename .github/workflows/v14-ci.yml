name: TROLL V14 Production Candidate CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v14/package.json
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Static invariants
        run: npm run validate:static
      - name: Compile Solidity 0.8.24
        run: npm run compile
      - name: Run V14 lifecycle and asset-lane tests
        run: npm test
