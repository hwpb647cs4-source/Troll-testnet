name: TROLL V21 Production Rehearsal CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal-v19:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v21
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v21/package.json

      - name: Verify frozen V19 target unchanged
        working-directory: .
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/

      - name: Install pinned rehearsal dependencies
        run: npm install --no-audit --no-fund

      - name: Validate blocked production template
        run: npm run validate:config

      - name: Stage exact V19 source into rehearsal project
        run: |
          mkdir -p contracts
          cp ../v19/contracts/TrollProductionCandidateV19.sol contracts/

      - name: Compile exact V19 production source
        run: npm run compile

      - name: Confirm no production credentials exist in CI
        run: |
          test -z "$DEPLOYER_PRIVATE_KEY"
          test -z "$RH_RPC_URL"
          echo "PASS — no production signer/RPC secrets"

      - name: Confirm no-broadcast gate
        run: |
          grep -q '"mode": "TEMPLATE_ONLY_DO_NOT_BROADCAST"' config/production.template.json
          grep -q "NO BROADCAST" docs/PRODUCTION_REHEARSAL.md
          echo "PASS — V21 remains rehearsal-only"
