name: TROLL V34 Security Findings Pipeline CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Findings pipeline tests
        run: |
          node --check v34/security/findings.mjs
          node v34/test/findings.test.mjs
      - name: Validate current register
        run: |
          node - <<'NODE'
          const r=require("./v34/findings-register.json");
          if(r.audit_target_commit!=="c3750b9458156e962393059f78c92e79802bf622") process.exit(1);
          if(r.findings.some(x=>["CRITICAL","HIGH"].includes(x.severity)&&x.status!=="CLOSED_VERIFIED")) process.exit(1);
          console.log("PASS findings register");
          NODE
      - name: Confirm no contracts or signing
        run: |
          test ! -d v34/contracts
          echo "PASS — V34 audit tooling only"
