name: TROLL V37 Asset Verification CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Asset verification unit tests
        run: |
          node --check v37/verification/robinhood-assets.mjs
          node v37/test/asset-verification.test.mjs
      - name: Confirm production template is still unverified
        run: |
          node - <<'NODE'
          const x=require("./v37/production-assets.template.json");
          if(x.status!=="UNVERIFIED_TEMPLATE") process.exit(1);
          if(!x.assets.every(a=>a.verification==="OPEN"&&a.contract_address==="REPLACE_FROM_OFFICIAL_API")) process.exit(1);
          console.log("PASS — no production Stock Token addresses invented");
          NODE
      - name: Confirm no contracts/signing
        run: test ! -d v37/contracts
