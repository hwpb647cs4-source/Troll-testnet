name: TROLL Final Mainnet Rehearsal
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v19/package.json
      - name: Prove frozen V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Install V19 dependencies
        working-directory: v19
        run: npm install --no-audit --no-fund
      - name: Static validation
        working-directory: v19
        run: npm run validate:static
      - name: Compile frozen V19
        working-directory: v19
        run: npm run compile
      - name: Full V19 regression
        working-directory: v19
        run: npm test
      - name: Validate mainnet dry-run manifest
        working-directory: deploy/mainnet-v19
        run: node validate.cjs
      - name: Confirm no broadcast or secrets
        run: |
          ! grep -R "eth_sendRawTransaction\|--broadcast\|PRIVATE_KEY=" deploy/mainnet-v19
          ! grep -R "robinhood-mainnet.g.alchemy.com/v2/[A-Za-z0-9]" deploy/mainnet-v19
          echo "PASS — no mainnet broadcast/secrets"
