name: Production Safe Multisig Preflight CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm frozen V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Validate Safe canonical deployment preflight
        run: node production/multisig/test/safe-preflight.test.cjs
      - name: Confirm signer set is configured and Safe is not yet claimed created
        run: |
          node - <<'NODE'
          const x=require("./production/multisig/safe-preflight.json");
          if(x.production_safe.status!=="SIGNERS_CONFIGURED_SAFE_CREATION_PENDING") process.exit(1);
          if(x.production_safe.owners.length!==3) process.exit(1);
          if(new Set(x.production_safe.owners.map(v=>v.toLowerCase())).size!==3) process.exit(1);
          if(!x.production_safe.owners.every(v=>/^0x[0-9a-fA-F]{40}$/.test(v))) process.exit(1);
          if(x.production_safe.address!==null) process.exit(1);
          console.log("PASS — 2-of-3 signer set configured; on-chain Safe creation still required");
          NODE
