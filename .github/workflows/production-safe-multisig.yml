name: Production Safe Multisig Preflight CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm frozen V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Validate Safe canonical deployment preflight
        run: node production/multisig/test/safe-preflight.test.cjs
      - name: Confirm private replacement signer hold
        run: |
          node - <<'NODE'
          const x=require("./production/multisig/safe-preflight.json");
          if(x.production_safe.status!=="PRIVATE_REPLACEMENT_SIGNERS_CONFIRMED_SAFE_CREATION_PENDING") process.exit(1);
          if(x.production_safe.owner_count!==3||x.production_safe.threshold!==2) process.exit(1);
          if(x.production_safe.owners_publication!=="WITHHELD_PREDEPLOYMENT") process.exit(1);
          if(x.production_safe.address!==null) process.exit(1);
          console.log("PASS — replacement signers confirmed privately; Safe creation still required");
          NODE
