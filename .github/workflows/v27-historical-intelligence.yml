name: TROLL V27 Historical Intelligence CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm V19 review target unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Syntax checks
        run: |
          node --check v27/analytics/historical.mjs
          node --check v27/analytics/activity-feed.mjs
      - name: Historical reducer tests
        run: node v27/test/historical.test.mjs
      - name: Confirm read-only analytics
        run: |
          test ! -d v27/contracts
          ! grep -R "eth_sendTransaction\|eth_sendRawTransaction\|eth_requestAccounts" v27/analytics
          echo "PASS — V27 read-only analytics"
