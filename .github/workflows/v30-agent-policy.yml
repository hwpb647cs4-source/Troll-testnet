name: TROLL V30 Agent Policy CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Syntax and policy tests
        run: |
          node --check v30/policy/agent-policy.mjs
          node v30/test/agent-policy.test.mjs
      - name: Confirm no signer or broadcast implementation
        run: |
          test ! -d v30/contracts
          ! grep -R "eth_sendTransaction\|eth_sendRawTransaction\|privateKey\|seed phrase" v30/policy
          echo "PASS — V30 policy/preparation only"
