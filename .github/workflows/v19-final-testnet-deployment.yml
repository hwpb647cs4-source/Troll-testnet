name: TROLL V19 Final Testnet Deployment Build
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-final-testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v19/package.json
      - name: Verify exact frozen V19 source
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Install pinned V19 dependencies
        working-directory: v19
        run: npm install --no-audit --no-fund
      - name: Re-run V19 static checks
        working-directory: v19
        run: npm run validate:static
      - name: Compile exact V19
        working-directory: v19
        run: npm run compile
      - name: Run V19 regression suite
        working-directory: v19
        run: npm test
      - name: Export browser deployment artifacts
        run: node deploy/v19-testnet/scripts-export.cjs
      - name: Validate deployment artifact
        run: |
          node - <<'NODE'
          const x=require("./deploy/v19-testnet/compiled.json");
          if(x.reviewedCommit!=="c3750b9458156e962393059f78c92e79802bf622") process.exit(1);
          if(Object.keys(x.contracts).length!==9) process.exit(1);
          console.log("PASS frozen V19 deployment artifact");
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: TROLL-V19-FINAL-TESTNET-DEPLOYMENT
          path: deploy/v19-testnet/compiled.json
          retention-days: 30
