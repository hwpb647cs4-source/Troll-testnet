name: TROLL Blockhertz Reconciliation CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm frozen V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate reconciliation manifest
        run: |
          node - <<'NODE'
          const x=require("./audit/external/blockhertz/reconciliation.json");
          if(x.target_commit!=="c3750b9458156e962393059f78c92e79802bf622") process.exit(1);
          if(x.external_summary.risk_label!=="LOW_RISK") process.exit(1);
          if(x.coverage!=="PARTIAL_FROM_USER_SCREENSHOTS") process.exit(1);
          if(x.human_audit_gate!=="OPEN") process.exit(1);
          console.log("PASS external automated audit reconciliation");
          NODE
