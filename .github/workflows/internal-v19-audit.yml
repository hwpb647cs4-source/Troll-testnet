name: TROLL Internal V19 Audit Evidence
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  internal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v19/package.json
      - name: Prove exact frozen V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Install exact V19 dependencies
        working-directory: v19
        run: npm install --no-audit --no-fund
      - name: Static checks
        working-directory: v19
        run: npm run validate:static
      - name: Full V19 regression suite
        working-directory: v19
        run: npm test
      - name: Audit-report consistency
        run: |
          node - <<'NODE'
          const f=require("./audit/internal-v19/findings.json");
          if(f.target_commit!=="c3750b9458156e962393059f78c92e79802bf622") process.exit(1);
          if(f.mainnet_release!=="BLOCKED") process.exit(1);
          if(!f.findings.some(x=>x.id==="IA-01"&&x.severity==="HIGH")) process.exit(1);
          console.log("PASS internal audit evidence");
          NODE
