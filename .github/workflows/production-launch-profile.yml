name: Production Launch Profile CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm frozen V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Validate simplified launch profile
        run: node production/launch/test/launch-profile.test.cjs
      - name: Confirm fail-closed launch state
        run: |
          node - <<'NODE'
          const x=require("./production/launch/launch-profile.json");
          if(x.regulated_assets.production_enablement!==false) process.exit(1);
          if(x.mainnet.broadcast!==false) process.exit(1);
          console.log("PASS — production profile is simple and fail-closed");
          NODE
