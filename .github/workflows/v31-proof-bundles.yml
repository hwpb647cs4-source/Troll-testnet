name: TROLL V31 Verifiable Proof Bundles CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Syntax and deterministic proof tests
        run: |
          node --check v31/proof/proof-bundle.mjs
          node --check v31/proof/collection-root.mjs
          node v31/test/proof-bundle.test.mjs
      - name: Confirm proof-only layer
        run: |
          test ! -d v31/contracts
          ! grep -R "eth_sendTransaction\|eth_sendRawTransaction\|eth_requestAccounts" v31/proof
          echo "PASS — V31 proof/export only"
