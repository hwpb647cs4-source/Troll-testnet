name: TROLL V47 Observability SLO CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: SLO tests
        run: |
          node --check v47/observability/slo.mjs
          node v47/test/slo.test.mjs
      - name: Confirm production monitoring remains open
        run: |
          node -e 'const x=require("./v47/status.json"); if(x.production_monitoring_provider_selected!==false||x.synthetic_checks_enabled!==false) process.exit(1); console.log("PASS monitoring not falsely claimed")'
          test ! -d v47/contracts
