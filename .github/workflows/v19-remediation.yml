name: TROLL V19 Slither Remediation CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v19/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Static remediation invariants
        run: npm run validate:static

      - name: Compile Solidity 0.8.24
        run: npm run compile

      - name: Run focused remediation + full lifecycle tests
        run: npm test

      - name: Install pinned Slither
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install slither-analyzer==0.11.6
          slither --version

      - name: Run Slither against V19
        run: |
          mkdir -p generated
          set +e
          slither . --exclude-dependencies --json generated/slither.json
          code=$?
          set -e
          if [ ! -s generated/slither.json ]; then
            echo "Slither failed without producing JSON"
            exit $code
          fi
          echo "Slither command exit code: $code"

      - name: Enforce zero High/Medium Slither findings
        run: python scripts/slither-gate.py generated/slither.json

      - name: Upload V19 Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TROLL-V19-SLITHER-REPORT
          path: v19/generated/slither.json
          if-no-files-found: warn
          retention-days: 30
