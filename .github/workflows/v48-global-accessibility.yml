name: TROLL V48 Global Accessibility CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: i18n and accessibility tests
        run: |
          node --check v48/i18n/i18n.mjs
          node --check v48/accessibility/a11y.mjs
          node v48/test/global-accessibility.test.mjs
      - name: Confirm canonical evidence IDs preserved
        run: |
          node - <<'NODE'
          const p=require("./v48/policy.json");
          if(p.supported_locales.join(",")!=="en,pt-BR,es") process.exit(1);
          if(p.canonical_evidence_ids.length!==4) process.exit(1);
          if(p.protocol_values_never_localized!==true) process.exit(1);
          console.log("PASS global presentation policy");
          NODE
          test ! -d v48/contracts
