name: TROLL V15 Security Hardening CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v15/package.json
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Static security invariants
        run: npm run validate:static
      - name: Compile Solidity 0.8.24
        run: npm run compile
      - name: Run V15 adversarial security tests
        run: npm test
