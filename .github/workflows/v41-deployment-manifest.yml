name: TROLL V41 Deployment Manifest CI
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm V19 unchanged
        run: git diff --exit-code c3750b9458156e962393059f78c92e79802bf622 -- v19/
      - name: Deployment-manifest tests
        run: |
          node --check v41/manifest/deployment-manifest.mjs
          node v41/test/deployment-manifest.test.mjs
      - name: Confirm final rehearsal remains blocked
        run: |
          node - <<'NODE'
          const x=require("./v41/deployment.template.json");
          if(x.status!=="OPEN_DEPENDENCIES"||x.mode!=="REHEARSAL_ONLY_NO_BROADCAST") process.exit(1);
          if(!Object.values(x.dependencies).every(v=>v==="OPEN")) process.exit(1);
          console.log("PASS — final rehearsal honestly blocked");
          NODE
          test ! -d v41/contracts
