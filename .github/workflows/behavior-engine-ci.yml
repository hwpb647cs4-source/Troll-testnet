name: Behavior Engine Experimental CI

on:
  push:
    branches:
      - 'behavior-engine/**'
    paths:
      - 'behavior-engine/**'
      - '.github/workflows/behavior-engine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavior-engine-v01:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: behavior-engine/v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: behavior-engine/v0.1/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run compile
      - run: npm test
