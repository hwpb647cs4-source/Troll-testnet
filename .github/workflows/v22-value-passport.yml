name: TROLL V22 Value Passport CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  value-passport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm reviewed V19 source remains unchanged
        run: |
          git diff --exit-code             c3750b9458156e962393059f78c92e79802bf622             -- v19/

      - name: Validate V22 schema, sample and growth constitution
        run: node v22/scripts/validate-v22.cjs

      - name: Confirm V22 is read-only product layer
        run: |
          test ! -d v22/contracts
          echo "PASS — V22 adds no Solidity contracts"
