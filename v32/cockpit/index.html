<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TROLL Release Control</title>
<style>body{margin:0;background:#050906;color:#effff3;font-family:system-ui}.w{max-width:900px;margin:auto;padding:16px}.p{background:#0a1510;border:1px solid #294a3a;border-radius:18px;padding:16px;margin:12px 0}h1{margin:0}b,.pass{color:#6cff75}.open{color:#ffd66c}.r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #173126;font-size:12px}.sub{color:#b9cdbf;font-size:12px;line-height:1.5}.big{font-size:28px;font-weight:900}</style></head><body><div class="w"><section class="p"><h1>TROLL <b>Release Control</b></h1><div class="sub">Machine-readable launch gates. This page cannot authorize or broadcast a transaction.</div><div id="mode" class="big open">LOADING</div></section><section class="p"><div id="summary"></div></section><section class="p"><h2>Release Gates</h2><div id="gates"></div></section></div>
<script type="module">import{evaluateRelease}from"./release-gates.js";const m=await fetch("../release-manifest.json?x="+Date.now()).then(r=>r.json()),r=evaluateRelease(m.gates);mode.textContent=r.ready?"READY FOR EXPLICIT AUTHORIZATION":"NO MAINNET BROADCAST";mode.className="big "+(r.ready?"pass":"open");summary.innerHTML='<div class="r"><span>Passed</span><b>'+r.summary.pass+' / '+r.summary.total+'</b></div><div class="r"><span>Open blockers</span><b>'+r.summary.open+'</b></div><div class="r"><span>Contract candidate</span><b>'+m.current_contract_candidate+'</b></div>';gates.innerHTML=r.rows.map(x=>'<div class="r"><span>'+x.id+'</span><b class="'+(x.status==="PASS"?"pass":"open")+'">'+x.status+'</b></div>').join("");</script></body></html>
